<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RisTecnologia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra Superior Fija -->
  <header class="barra-superior">
    
    <!-- 1. Izquierda: Opciones transformadas en botones -->
    <nav class="menu-izquierda" aria-label="Navegación principal">
      <a class="btn-menu" href="#inicio">Inicio</a>
      <a class="btn-menu" href="#productos">Productos</a>
      <a class="btn-menu" href="#contacto">Contacto</a>
    </nav>

    <!-- 2. Centro: Logo (puedes cambiar el 'src' por la ruta de tu logo) -->
    <a class="logo-centro" href="#inicio" aria-label="RisTecnologia, inicio">
      <img src="logo.jpg" alt="Logo" class="logo-img">
    </a>

    <div class="elementos-derecha">
      <input type="text" placeholder="Buscar..." class="input-busqueda">
      <button class="btn-carrito" type="button" aria-label="Abrir carrito" title="Carrito de compras">
        <span aria-hidden="true">&#128722;</span>
        <span class="cart-count" hidden>0</span>
      </button>
    </div>

  </header>

  <main class="contenido-pagina" id="inicio">
    <section class="carrusel" aria-label="Imágenes destacadas">
      <div class="carrusel-ventana">
        <div class="carrusel-pista" aria-live="polite">
          <article class="carrusel-diapositiva">
            <img src="destacado/destacado1.jpg" alt="Control Gamepad D11 para juegos móviles">
          </article>
          <article class="carrusel-diapositiva">
            <img src="destacado/destacado2.jpg" alt="Lámpara G multifuncional con altavoz Bluetooth">
          </article>
          <article class="carrusel-diapositiva">
            <img src="destacado/destacado3.jpg" alt="Reloj inteligente Ultra3 con correas disponibles">
          </article>
          <article class="carrusel-diapositiva">
            <img src="destacado/destacado4.jpg" alt="Lámpara G con reloj y carga inalámbrica">
          </article>
        </div>
      </div>
      <button class="carrusel-flecha carrusel-anterior" type="button" aria-label="Imagen anterior">&#8249;</button>
      <button class="carrusel-flecha carrusel-siguiente" type="button" aria-label="Imagen siguiente">&#8250;</button>
      <div class="carrusel-indicadores" aria-label="Elegir imagen">
        <button class="carrusel-punto activo" type="button" aria-label="Ir a la imagen 1" aria-current="true"></button>
        <button class="carrusel-punto" type="button" aria-label="Ir a la imagen 2"></button>
        <button class="carrusel-punto" type="button" aria-label="Ir a la imagen 3"></button>
        <button class="carrusel-punto" type="button" aria-label="Ir a la imagen 4"></button>
      </div>
    </section>
  </main>

  <section class="catalogo" id="productos">
    <div class="destacado">
      <p>Nuevo y Destacado</p>
    </div>
    <div class="productos" aria-live="polite"></div>
  </section>

  <footer class="site-footer" id="contacto">
    <div class="footer-contenido">
      <a class="footer-marca" href="#inicio" aria-label="RisTecnologia, volver al inicio">
        <img src="logo.jpg" alt="RisTecnologia">
      </a>
      <div class="footer-columna">
        <h2>Contacto</h2>
        <a href="tel:+584123260875">04123260875</a>
        <a href="mailto:ventaspublicitario@gmail.com">ventaspublicitario@gmail.com</a>
      </div>
      <div class="footer-columna">
        <h2>Atención</h2>
        <a href="https://wa.me/584123260875" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
        <a href="https://wa.me/c/584123260875" target="_blank" rel="noopener">Ver catálogo de WhatsApp</a>
      </div>
      <div class="footer-columna footer-redes">
        <h2>Síguenos</h2>
        <div class="footer-enlaces-sociales">
          <a href="https://www.instagram.com/ristecnologia.ve?utm_source=qr&amp;stkn=MTU2dTFhZTFtOHF6dw==" target="_blank" rel="noopener" aria-label="Instagram de RisTecnologia">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="social-punto" cx="18" cy="6" r="1"></circle></svg>
            <span>Instagram</span>
          </a>
          <a href="https://www.tiktok.com/@ristecnologia.ve?_r=1&amp;_t=ZS-9ACz1uJ2by5" target="_blank" rel="noopener" aria-label="TikTok de RisTecnologia">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3v11.2a4.2 4.2 0 1 1-3.2-4.08v3.32a1.1 1.1 0 1 0 .2.62V3h3c.2 2.1 1.5 3.7 4 4.1v3.1A8 8 0 0 1 15 8.8"></path></svg>
            <span>TikTok</span>
          </a>
        </div>
      </div>
    </div>
    <div class="footer-copyright">© 2026 RisTecnologia. Todos los derechos reservados.</div>
  </footer>

  <script src="catalogo.js"></script>
  <script src="java.js"></script>
</body>
</html>
